services:
  postgres:
    image: postgres:16-alpine
    container_name: swoonrush-inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: swoonrush
      POSTGRES_PASSWORD: swoonrush
      POSTGRES_DB: swoonrush
    ports:
      - '55433:5432'
    volumes:
      - swoonrush_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U swoonrush -d swoonrush']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: swoonrush-inventory-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: swoonrush-minio
      MINIO_ROOT_PASSWORD: swoonrush-minio-secret
    ports:
      - '59010:9000' # S3 API
      - '59011:9001' # Web console
    volumes:
      - swoonrush_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot job that creates + public-reads the product-images bucket on startup.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 swoonrush-minio swoonrush-minio-secret; do sleep 1; done;
      mc mb --ignore-existing local/product-images;
      mc anonymous set download local/product-images;
      exit 0;
      "

volumes:
  swoonrush_postgres_data:
  swoonrush_minio_data:
